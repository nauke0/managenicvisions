name: Show monitor

# Checks the MyCompPrep competition calendar daily and opens an issue
# (which GitHub emails to you) when a new SA or VIC show is listed.
on:
  schedule:
    - cron: "13 21 * * *"  # daily, early morning Adelaide time
  workflow_dispatch:  # adds a "Run workflow" button on the Actions tab
  push:
    branches: [claude/sweet-carson-bnejgu]  # dry-run test only; remove once on main

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/show_monitor.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'push' && '1' || '' }}
