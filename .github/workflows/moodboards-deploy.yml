name: Deploy client moodboards

# Publishes the private moodboard site (moodboards/) to Cloudflare whenever a
# board is added or updated. Confirmations written by the site itself don't
# trigger a redeploy.
on:
  push:
    branches: [main]
    paths:
      - "moodboards/**"
      - "!moodboards/confirmations/**"
      - ".github/workflows/moodboards-deploy.yml"
  workflow_dispatch:

concurrency:
  group: moodboards-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONFIRM_TOKEN: ${{ secrets.MOODBOARD_GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: moodboards
    steps:
      - uses: actions/checkout@v5
      - name: Check setup
        id: setup
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=Moodboards not deployed::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (see moodboards/README.md), then run this workflow again."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v5
        if: steps.setup.outputs.ready == 'true'
        with:
          node-version: "22"
      - name: Deploy
        if: steps.setup.outputs.ready == 'true'
        run: npx --yes wrangler@4 deploy
      - name: Set confirmation token
        if: steps.setup.outputs.ready == 'true' && env.CONFIRM_TOKEN != ''
        run: printf '%s' "$CONFIRM_TOKEN" | npx --yes wrangler@4 secret put GITHUB_TOKEN
